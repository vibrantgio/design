<!doctype html>
<!-- Focus-ring mirror fixture (design/mirror) — NOT part of the published
     bundle. A focused text field standing inside a dialog: the published
     sheet must promote the field's border to the scheme's one ring, the same
     colour it draws on the page, because the ring is measured against every
     storey at once and a raised host hands nothing down. A raised storey is
     where a ground-derived ring would part from a scheme-derived one. The
     capture frames only the field, so the dialog ancestor is reduced to its
     ground: display contents strips its box while keeping the inherited
     custom properties live, and the body paints the host's own fill token. -->
<meta charset="utf-8">
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { margin: 0; }
  body { background: var(--elevation-2); }
  .dialog { display: contents; }
  .input { width: 220px; }
</style>
<div class="dialog">
  <input class="input is-focus" type="text" placeholder="Placeholder">
</div>
