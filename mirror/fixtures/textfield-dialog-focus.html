<!doctype html>
<!-- AQ1.3 mirror fixture (design/mirror) — NOT part of the published bundle.
     A focused text field standing inside a dialog: the published sheet's
     storey-local pair (.dialog declares --ground-focus-ring) must promote the
     field's border to the rung the primary ramp measures against the DIALOG's
     level-2 fill, not the ground floor's rung, which reads 2.92:1 there. The
     capture frames only the field, so the dialog ancestor is reduced to its
     ground: display contents strips its box while keeping the inherited
     custom properties live, and the body paints the host's own fill token. -->
<meta charset="utf-8">
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { margin: 0; }
  body { background: var(--elevation-2); }
  .dialog { display: contents; }
  .input { width: 220px; }
</style>
<div class="dialog">
  <input class="input is-focus" type="text" placeholder="Placeholder">
</div>
