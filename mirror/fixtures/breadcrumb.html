<!-- G2.3 mirror fixture (design/mirror) — NOT part of the published bundle.
     patterns/breadcrumb at the breadcrumb goldens' light configuration: the
     published sheet's own .crumbs classes, breadcrumb_test.go's trail
     (Home / Design / Tokens), the last segment on the Text pin, on the
     Background pin ground the Gio capture wraps the trail in. The trail
     fills the 320x32 canvas the way the Gio capture does: layout.Exact
     hands every Rigid segment the full 32 cross minimum, and the labels
     centre their title-small line box within that slot the same way the
     published .crumbs row centres its items — no per-segment alignment
     override. (This fixture used to top-align the .crumb segments to
     reproduce a Gio-side flooring bug; the label layer centres in its
     floor now, so the published sheet's centring is the shared truth.) -->
