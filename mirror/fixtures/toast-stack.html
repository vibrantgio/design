<!doctype html>
<!-- G2.4 mirror fixture (design/mirror) — NOT part of the published bundle.
     patterns/notifications at the light-three-stacked golden's configuration: the
     published sheet's .toast-stack anchored TopRight — inset S4 (16px) from
     the viewport edges, exactly paintColumn's edgePad — carrying the three
     status-role messages notifications_test.go shapes, newest (Warning) nearest the
     anchored top edge. The scene composites over the platform's content fill, as the
     toast goldens do, so the inverse fills are read against the surface app
     panes are painted with. -->
<meta charset="utf-8">
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { margin: 0; }
  body { position: relative; background: var(--platform-control-background); width: 320px; height: 240px; }
  .toast-stack { position: absolute; top: 16px; right: 16px; }
</style>
<div class="toast-stack">
  <div class="toast warning">Connection is slow</div>
  <div class="toast success">Workspace saved</div>
  <div class="toast">Syncing tokens</div>
</div>
