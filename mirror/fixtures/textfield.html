<!doctype html>
<!-- G2.1 mirror fixture (design/mirror) — NOT part of the published bundle.
     components/input's static text field showing its placeholder: the
     published sheet's .input class at the Gio reference's fixed width.
     The Gio render is 27px tall (the 27px text field height floor beats the
     system font's 16px line box), so
     the capture viewport is 220x27. -->
<meta charset="utf-8">
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { margin: 0; }
  body { background: var(--platform-window-background); }
  .input { width: 220px; }
</style>
<input class="input" type="text" placeholder="Placeholder">
