<!doctype html>
<!-- Badge mirror fixture (design/mirror) — NOT part of the published bundle.
     A badge speaking the Info status, at the light goldens' configuration: the
     published sheet's .badge.info pinned to the viewport origin over the
     platform's window background, the plane the Gio capture stands on. A
     badge wears the platform's system colour for its status under white,
     whatever it stands on; body's background paints the whole viewport, so
     that fill covers whatever size the harness captures at. -->
<meta charset="utf-8">
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { margin: 0; }
  body { position: relative; background: var(--platform-window-background); }
  .badge { position: absolute; top: 0; left: 0; }
</style>
<span class="badge info">Preview</span>
