<!doctype html>
<!-- G2.3 mirror fixture (design/mirror) — NOT part of the published bundle.
     patterns/tabs at TestTabsGolden's light-comfortable configuration: the
     published sheet's own .tabs classes, the three labels tabs_test.go
     shapes (Preview, Code, Notes), first selected, over the golden's
     240x128 canvas — the ControlHeight strip and the selected tab's content
     panel below it. The panel's flat #ff4040 is the golden fixture's
     specimen colour (contentRect), not the sheet's: content panels are the
     caller's, and fixtures may pin specimen colours where the class layer
     may not. -->
<meta charset="utf-8">
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { margin: 0; }
  body { background: var(--color-surface); }
  .tabs { width: 240px; }
  .panel { width: 240px; height: 92px; background: #ff4040; }
</style>
<div class="tabs" role="tablist">
  <button class="tab selected" role="tab" aria-selected="true">Preview</button>
  <button class="tab" role="tab" aria-selected="false">Code</button>
  <button class="tab" role="tab" aria-selected="false">Notes</button>
</div>
<div class="panel"></div>
