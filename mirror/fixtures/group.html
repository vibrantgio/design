<!doctype html>
<!-- G2.2 mirror fixture (design/mirror) — NOT part of the published bundle.
     patterns/group: the published sheet's own .group class, with only the
     fixed 280x200 geometry the Gio reference fills. The group takes the
     fill of the surface it is in and paints nothing there, so the page's own
     window background shows through and the platform's separator is the
     whole of what says where it ends. The title is the group's own,
     the group title's style in the platform's secondary label; the rest mirrors
     group_test.go's content. -->
<meta charset="utf-8">
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { margin: 0; }
  body { background: var(--platform-window-background); font-family: var(--font-family); }
  .group { width: 280px; height: 200px; }
  .slot-b {
    font-size: var(--font-callout-size);
    line-height: var(--font-callout-line-height);
    font-weight: var(--font-callout-weight);
    color: var(--platform-label);
  }
  .slot-m {
    font-size: var(--font-callout-size);
    line-height: var(--font-callout-line-height);
    font-weight: var(--font-callout-weight);
    color: var(--platform-secondary-label);
  }
</style>
<div class="group">
<div class="group-title">Density</div>
<div class="slot-b">Comfortable</div>
<div class="slot-m">Compact re-pitches</div>
</div>
