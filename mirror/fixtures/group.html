<!doctype html>
<!-- G2.2 mirror fixture (design/mirror) — NOT part of the published bundle.
     patterns/group: the published sheet's own .group class, with only the
     fixed 280x200 geometry the Gio reference fills. The group takes the
     fill of the surface it is in and paints nothing there, so the page's
     own --color-bg shows through and the hairline is the whole of what
     says where it ends. The label is the group's own, label-large in the
     ramp's low-contrast step; the rest mirrors group_test.go's content. -->
<meta charset="utf-8">
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { margin: 0; }
  body { background: var(--color-bg); font-family: var(--font-family); }
  .group { width: 280px; height: 200px; }
  .slot-b {
    font-size: var(--font-body-medium-size);
    line-height: var(--font-body-medium-line-height);
    font-weight: var(--font-body-medium-weight);
    letter-spacing: var(--font-body-medium-tracking);
    color: var(--color-text);
  }
  .slot-m {
    font-size: var(--font-body-medium-size);
    line-height: var(--font-body-medium-line-height);
    font-weight: var(--font-body-medium-weight);
    letter-spacing: var(--font-body-medium-tracking);
    color: var(--color-neutral-700);
  }
</style>
<div class="group">
<div class="group-label">Density</div>
<div class="slot-b">Comfortable</div>
<div class="slot-m">Compact re-pitches</div>
</div>
