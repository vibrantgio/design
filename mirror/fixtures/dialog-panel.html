<!doctype html>
<!-- G2.4 mirror fixture (design/mirror) — NOT part of the published bundle.
     patterns/modal's PANEL intent at the modal goldens' light configuration:
     the published sheet's .scrim + .dialog over the bg pin, the title the
     goldens shape ("Preferences"), the ghost icon close (.btn.ghost.icon
     with the crossIcon geometry: 20x20 glyph box, strokes 2, inked from 6
     to 14), and modal_test.go's 40 dp grey body stand-in — a specimen
     colour a fixture may pin where the class layer may not. The scrim is
     the dialog's centring parent, exactly as drawModal centres the surface
     in its canvas. -->
<meta charset="utf-8">
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { margin: 0; }
  body { background: var(--color-bg); width: 320px; height: 240px; }
  .body-slot { width: 100%; height: 40px; background: #c8c8c8; }
</style>
<div class="scrim">
  <div class="dialog">
    <div class="dialog-header">
      <div class="dialog-title">Preferences</div>
      <button class="btn ghost icon" aria-label="Close"><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="14" y2="14"/><line x1="14" y1="6" x2="6" y2="14"/></svg></button>
    </div>
    <div class="body-slot"></div>
  </div>
</div>
