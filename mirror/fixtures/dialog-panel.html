<!doctype html>
<!-- G2.4 mirror fixture (design/mirror) — NOT part of the published bundle.
     patterns/modal's PANEL purpose at the modal goldens' light configuration:
     the published sheet's .scrim + .dialog over the platform's window background, the title the
     goldens shape ("Preferences"), the ghost icon close (.btn.ghost.icon
     with the crossIcon geometry: 20x20 glyph box, strokes 2, stroked from 6
     to 14), and modal_test.go's 40 dp grey body stand-in — a specimen
     colour a fixture may pin where the class layer may not. The scrim is
     the dialog's centring parent, exactly as drawModal centres the surface
     in its viewport. -->
<meta charset="utf-8">
<link rel="stylesheet" href="/styles.css">
<style>
  html, body { margin: 0; }
  /* The scrim is pinned to the pixel the Gio reference lands on rather than
     read from the class, and this is the one place in the set where the two
     sides genuinely disagree. patterns/modal hands Gio the platform's scrim
     as a coverage and never flattens it, and Gio composites a coverage in
     LINEAR light where the platform, the browser and theme/color.Flatten
     composite in encoded sRGB: the same #00000033 lands on #e7e7e7 here and
     on #cccccc in Chromium. The pin keeps this pair scoring the dialog
     instead of re-measuring that divergence, which is recorded for its own
     task; fixtures may pin specimen values, the class layer may not. */
  .scrim { background: #e7e7e7; }
  body { background: var(--platform-window-background); width: 320px; height: 240px; }
  .body-slot { width: 100%; height: 40px; background: #c8c8c8; }
</style>
<div class="scrim">
  <div class="dialog">
    <div class="dialog-header">
      <div class="dialog-title">Preferences</div>
      <button class="btn ghost icon" aria-label="Close"><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="14" y2="14"/><line x1="14" y1="6" x2="6" y2="14"/></svg></button>
    </div>
    <div class="body-slot"></div>
  </div>
</div>
